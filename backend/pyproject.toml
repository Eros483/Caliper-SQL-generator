[project]
name = "caliperlens"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-community",
    "sqlalchemy",
    "mysql-connector-python",
    "pymysql",
    "cryptography",
    "langgraph",
    "fastapi",
    "faiss-cpu",
    "langchain-google-genai",
    "networkx",
    "langchain-core",
    "uvicorn",
    "pydantic-settings",
    "docker",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.10",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "python-json-logger>=4.1.0",
    "sqlglot>=30.14.0",
    "diagrams>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "black>=24.0",
    "ruff>=0.4",
    "dbt-duckdb>=1.10.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
